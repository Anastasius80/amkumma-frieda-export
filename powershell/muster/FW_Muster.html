  }
  const secondaryTables = new Set(M.secondaryTables || []);

  const detailHref = (t, r) => '#d/' + encodeURIComponent(t.key) + '/' + encodeURIComponent(r[t.idIdx]);

  const cleanHeader = h => h.replace(/^(tblxx_|tblkett_|loktbl_|tbl_)|_ID$/gi, '');
  // Grabbezüge eines Datensatzes: direkte Verweise auf das Grab oder über eine Zwischentabelle mit Grabverweis

      const mid = T[c.fk];

      if (gi < 0 || rel.t === grabTable || derivedTables.has(rel.t.key)) continue;
      for (const cr of relMap(rel).get(String(r[t.idIdx])) || []) if (!isEmpty(cr[gi])) out.push({ id: String(cr[gi]), via: rel.t.name });
    }
    const seen = new Set();
    return out.filter(x => grabTable.byId.has(x.id) && !seen.has(x.id + '|' + x.via) && seen.add(x.id + '|' + x.via));
  }
  // Personen je Grab (über grabLinks), einmalig aufgebaut
  let personsByGrab = null;
  function getPersonsByGrab() {
    if (personsByGrab) return personsByGrab;
    // je Grab jede Person nur einmal, alle Bezüge zusammengefasst
    const tmp = new Map();
    for (const t of personTables) for (const r of t.rows) for (const g of grabLinks(t, r)) {
      let persons = tmp.get(g.id);
      if (!persons) tmp.set(g.id, persons = new Map());
      const key = t.key + '|' + r[t.idIdx];
      let p = persons.get(key);
      if (!p) persons.set(key, p = { t, r, vias: new Set() });
      p.vias.add(g.via);
    }
    personsByGrab = new Map();
    for (const [id, persons] of tmp) personsByGrab.set(id, [...persons.values()].map(p => ({ t: p.t, r: p.r, via: [...p.vias].join(', ') })));
    return personsByGrab;
  }
  // Berechtigte: Eintrag als Berechtigter in einer Berechtigungstabelle (bzw. Tabelle tbl_Berechtigter).
  // Hinweis: Kategorie_B ist in FriedaWeb bei den Bestatteten gesetzt und kennzeichnet keine Berechtigten.
  let holderIds = null;
  function isHolder(t, r) {
    if (!holderIds) {
      holderIds = new Map();
      for (const pt of personTables) {
        const s = new Set();
        for (const rel of rev[pt.key] || []) if (/berechtigt/i.test(rel.t.key) && /berechtigter/i.test(rel.t.cols[rel.i].h)) for (const k of relMap(rel).keys()) s.add(k);
        holderIds.set(pt, s);

  }
  const isDead = (t, r) => t.key === 'tbl_Verstorbener' || !isEmpty(val(t, r, 'Sterbedatum'));

  // Suchtext je Grab: eigene Daten plus verknüpfte Personen bzw. Personenbezüge (z. B. Berechtigungen)
  let grabIndex = null;
  function buildGrabIndex() {
    if (grabIndex || !grabTable) return grabIndex;
    const personKeys = new Set(personTables.map(t => t.key));
    const rels = (rev[grabTable.key] || []).filter(rel => !derivedTables.has(rel.t.key) && (personKeys.has(rel.t.key) || rel.t.cols.some(c => c.fk && personKeys.has(c.fk))));
    const docRels = (rev[grabTable.key] || []).filter(rel => documentTables.has(rel.t.key));
    const byGrab = getPersonsByGrab();
    grabIndex = grabTable.rows.map(r => {
      const id = String(r[grabTable.idIdx]);
      let text = rowText(grabTable, r), docs = 0;
      for (const rel of rels) for (const cr of relMap(rel).get(id) || []) text += rowText(rel.t, cr);
      for (const rel of docRels) docs += (relMap(rel).get(id) || []).length;
      const persons = byGrab.get(id) || [];

    return grabIndex;
  }

  // ---------- Grab: Belegung, Grabstellen, Status (wie die Grabansicht in FRIEDA) ----------
  const TODAY = (d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'))(new Date());
  const dateKey = v => (isEmpty(v) ? '' : String(v).slice(0, 10));
  const burialRel = burialTable ? (rev[grabTable.key] || []).find(rel => rel.t === burialTable) : null;
  const burialsOf = id => (burialRel ? relMap(burialRel).get(String(id)) || [] : []);
  const bval = (r, h) => val(burialTable, r, h);
  // Erd- (E) oder Urnenbestattung (U): nach Position (E1, U2 …), sonst nach Bestattungsart
  function burialKind(r) {
    const p = String(bval(r, 'Position') ?? '').trim().toUpperCase();

  }
  // Zuordnung Grab–Grabstelle mit den Kennzeichen E1 … / U1 … (mögliche Erd- bzw. Urnenplätze je Grabstelle)
  const slotTable = grabTable ? Object.values(T).find(t => t !== grabTable && !derivedTables.has(t.key)
    && t.cols.some(c => c.r && c.fk === grabTable.key) && 'E1' in t.idx && 'U1' in t.idx) || null : null;
  const slotRel = slotTable ? (rev[grabTable.key] || []).find(rel => rel.t === slotTable) : null;
  const slotsOf = id => (slotRel ? relMap(slotRel).get(String(id)) || [] : []);
  const stelleCol = slotTable ? slotTable.cols.findIndex(c => c.r && c.fk && c.fk !== grabTable.key && T[c.fk]) : -1;
  function stelleName(s) {
    const v = s[stelleCol], st = stelleCol >= 0 ? T[slotTable.cols[stelleCol].fk] : null, sr = st && st.byId.get(String(v));
    const b = sr ? val(st, sr, 'Bezeichnung') : null;
    return isEmpty(b) ? fmt(v) : String(b);
  }
  const flagIdx = (t, p) => t.cols.map((c, i) => (new RegExp('^' + p + '\\d+$').test(c.h) ? i : -1)).filter(i => i >= 0);
  const flagCount = (r, idx) => idx.reduce((n, i) => n + (r[i] === true ? 1 : 0), 0);
  // null, wenn das Datenmodell keine Platz-Kennzeichen (E1 … / U1 …) kennt
  function occupancy(gr) {
    if (!slotTable && !flagIdx(grabTable, 'E').length && !flagIdx(grabTable, 'U').length) return null;
    const id = gr[grabTable.idIdx], slots = slotsOf(id);
    let e = 0, u = 0;
    if (slots.length) {
      const ei = flagIdx(slotTable, 'E'), ui = flagIdx(slotTable, 'U');
      for (const s of slots) { e += flagCount(s, ei); u += flagCount(s, ui); }
    } else {
      // ohne Grabstellen-Zuordnung: Kennzeichen am Grab je Grabstelle
      const n = Number(val(grabTable, gr, 'AnzGrabstellen')) || 1;
      e = flagCount(gr, flagIdx(grabTable, 'E')) * n; u = flagCount(gr, flagIdx(grabTable, 'U')) * n;
    }
    // belegt = Bestattete mit noch laufender Ruhezeit

    for (const b of burialsOf(id)) if (dateKey(bval(b, 'Ruhezeit bis')) >= TODAY) used[burialKind(b)]++;
    const line = (h, b, m) => ({ h, b, f: Math.max(m - b, 0), m });
    const rows = [line('Erdbestattungen', used.E, e), line('Urnen', used.U, u)];
    rows.push(line('Gesamt', used.E + used.U, e + u));
    return rows;
  }
  function stellenText(gr) {
    const names = slotsOf(gr[grabTable.idIdx]).map(stelleName).sort(collator.compare);
    const n = names.length || Number(val(grabTable, gr, 'AnzGrabstellen')) || 0;
    if (!n) return '';
    const count = n + (n === 1 ? ' Stelle' : ' Stellen');
    if (!names.length) return count;
    const nums = names.map(Number);
    const range = names.length > 1 && nums.every((x, i) => Number.isInteger(x) && (i === 0 || x === nums[i - 1] + 1));

  }
  // Sperrungen (je Grab oder je Grabstelle) mit Sperrdatum bis heute und ohne bzw. künftiger Freigabe
  let lockedGraves = null;
  function getLocked() {
    if (lockedGraves) return lockedGraves;
    lockedGraves = new Map();
    const stelleTable = stelleCol >= 0 ? slotTable.cols[stelleCol].fk : null;
    const lockTable = Object.values(T).find(t => /sperr/i.test(t.key) && 'Sperrdatum' in t.idx);
    const lockCol = lockTable ? lockTable.cols.findIndex(c => c.r && c.fk && (c.fk === grabTable.key || c.fk === stelleTable)) : -1;

      if ((from && from > TODAY) || (to && to < TODAY)) continue;

    }

    LEVELS.reduce((d, [h]) => d || collator.compare(gtext(a, h), gtext(b, h)), 0) || collator.compare(grabNr(a), grabNr(b))));

  const matches = (text, ts) => ts.every(x => text.includes(x));

  const newGrabState = () => ({ q: '', f: {}, status: new Set(STATUS.map(s => s[0])), docsOnly: false, sort: null, shown: PAGE });

  function setNav(view) {

  }

  function selectionPanel(current, onChange) {
    const st = state.grab;

    if (current) for (const [h] of levels) st.f[h] = gtext(current, h);

    const statusBoxes = STATUS.map(([k, label]) => {
      const cb = el('input', { type: 'checkbox', checked: st.status.has(k) });
      cb.addEventListener('change', () => { if (cb.checked) st.status.add(k); else st.status.delete(k); st.shown = PAGE; onChange(); });
      return el('label', { class: 'check' }, cb, label);
    });
    let rows = pool;
    const selects = levels.map(([h, label], n) => {
      const options = [...new Set(rows.map(r => gtext(r, h)).filter(Boolean))];
      const s = el('select', null, el('option', { value: '' }, 'alle'), options.map(v => el('option', { value: v, selected: st.f[h] === v }, v)));
      s.addEventListener('change', () => {
        st.f[h] = s.value;
        for (const [lower] of levels.slice(n + 1)) st.f[lower] = '';
        st.shown = PAGE;
        if (location.hash === '#grab') onChange(); else location.hash = '#grab';
      });
      if (st.f[h]) rows = rows.filter(r => gtext(r, h) === st.f[h]);
      return el('label', null, label, s);
    });
    // Grabliste erst bei überschaubarer Auswahl (z. B. nach Wahl der Reihe)
    const reiheChosen = !levels.some(([h]) => h === 'Reihe') || !!st.f.Reihe;
    const listable = reiheChosen || rows.length <= 300;
    const grave = el('select', { disabled: !listable },
      el('option', { value: '' }, listable ? '– Grab wählen –' : 'zuerst Reihe wählen'),

        return el('option', { value: r[grabTable.idIdx], selected: r === current }, (reiheChosen ? grabNr(r) : grabName(r)) + (s === 'aktuell' ? '' : ' – ' + statusLabel(s)));

      el('div', { class: 'statusbar' }, el('strong', null, 'Grabauswahl'), statusBoxes),

  }

  function resultTable(columns, items, st, onRow) {
    // columns: [{h, get(item) -> Wert für Anzeige/Sortierung, node(item)?}]
    if (st.sort) {
      const c = columns[st.sort.i];
      const key = c && (c.key || c.get);
      if (c) items = items.slice().sort((a, b) => st.sort.dir * collator.compare(String(key(a) ?? ''), String(key(b) ?? '')));
    }
    const head = el('tr', null, columns.map((c, i) => el('th', { on: { click: () => { st.sort = st.sort && st.sort.i === i ? { i, dir: -st.sort.dir } : { i, dir: 1 }; st.rerender(); } } },
      c.h + (st.sort && st.sort.i === i ? (st.sort.dir > 0 ? ' ▲' : ' ▼') : ''))));
    const body = el('tbody');
    for (const it of items.slice(0, st.shown)) {
      body.append(el('tr', { class: 'click', on: { click: () => onRow(it) } }, columns.map(c => cell(c.node ? c.node(it) : fmtCell(c.get(it)), c.raw ? c.raw(it) : undefined))));
    }
    return { node: el('div', { class: 'tablewrap' }, el('table', null, el('thead', null, head), body)), items };
  }
  const fmtCell = v => (isEmpty(v) ? '' : String(v));

  function downloadCsv(name, columns, items) {
    const esc = v => { const s = isEmpty(v) ? '' : String(v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [columns.map(c => esc(c.h)).join(';')].concat(items.map(it => columns.map(c => esc(c.get(it))).join(';')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

      visible.length < t.cols.filter(c => !c.x).length && el('p', { class: 'muted' }, 'Liste zeigt die ersten Spalten; alle Felder auf der Detailseite.'));
    let timer;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = q.value; st.shown = PAGE; run(); }, 200); });
    st.rerender = run;
    function run() {
      const ts = terms(st.q);
      const items = index.filter(it => matches(it.text, ts));
      const res = resultTable(columns, items, st, it => { if (t.idIdx >= 0) location.hash = detailHref(t, it.r); });
      currentPrint = () => printList(t.name, columns, res.items, st.q && 'Suche „' + st.q + '“');
      fill(out, toolbar(res.items, st, columns, t.name.replace(/[^\wäöüÄÖÜß-]/g, '_') + '.csv'), res.node, moreButton(res.items, st));
    }
    run();
  }

  // ---------- Druckvorlage ----------
  // Beim Drucken (Knopf oder Strg+P) wird die aktuelle Ansicht als eigene, druckgerechte Seite in #print aufgebaut.
  const printBox = document.getElementById('print');
  let currentPrint = null;
  const MAX_PRINT_TABLE_COLUMNS = 7;
  function printValue(c, v) {
    if (isEmpty(v)) return '';
    if (typeof v === 'boolean') return v ? '☑ Ja' : '☐ Nein';
    if (typeof v === 'object') return v.f;
    if (typeof v === 'object' && 'i' in v) return fmt(v);
    if (c && c.fk && T[c.fk] && T[c.fk].byId.has(String(v))) return title(T[c.fk], T[c.fk].byId.get(String(v)));
    return fmt(v, c);
  }
  const printKv = (k, v) => el('div', { class: 'p-kv' }, el('span', { class: 'p-k' }, k), el('span', { class: 'p-v' }, v));
  function printHead(text, sub) {
    return el('div', { class: 'p-head' }, el('div', { class: 'p-title' }, text),
      el('div', { class: 'p-meta' }, [sub, M.title, 'Quelle ' + (M.source || ''), 'gedruckt ' + new Date().toLocaleString('de-AT')].filter(Boolean).join(' · ')));
  }
  function printTable(heads, rows) {
    return el('table', { class: 'p-table' }, el('thead', null, el('tr', null, heads.map(h => el('th', null, h)))),
      el('tbody', null, rows.map(cells => el('tr', null, cells.map(c => el('td', null, c))))));
  }
  // Verknüpfte Datensätze: schmale Bereiche als Tabelle, breite als Datensatz-Blöcke (nichts wird abgeschnitten)
  function printRows(t, rows, skipIndex) {
    const used = t.cols.map((c, i) => i).filter(i => i !== skipIndex && !t.cols[i].x && rows.some(r => !isEmpty(r[i])));
    if (used.length <= MAX_PRINT_TABLE_COLUMNS) {
      return printTable(used.map(i => t.cols[i].h), rows.map(r => used.map(i => printValue(t.cols[i], r[i]))));
    }
    return el('div', null, rows.map(r => el('div', { class: 'p-rec' },
      el('div', { class: 'p-rec-title' }, title(t, r)),
      el('div', { class: 'p-fields' }, used.filter(i => !isEmpty(r[i])).map(i => printKv(t.cols[i].h, printValue(t.cols[i], r[i])))))));
  }
  function printDetail(t, r, prints) {
    const parts = [printHead(title(t, r), t.name)];
    const section = (head, content) => parts.push(head ? el('div', { class: 'p-sec' }, el('h3', null, head), content) : content);
    printOpen(prints, section);
    parts.push(el('div', { class: 'p-note' }, 'Auszug aus dem FriedaWeb-Archiv. Enthält personenbezogene Daten – nur für berechtigte Personen.'));
    return parts;
  }
  // Aufgeklappte (bzw. nicht einklappbare) Bereiche der Ansicht drucken
  function printOpen(prints, section) {
    for (const p of prints) if (!p.box || p.box.open) section(p.head, p.build());
  }
  // Grabblatt: Grabinfo, Belegung, Verstorbene im Grab, Nutzungsberechtigte (eine Seite je Grab)
  function printGrab(r, id, prints) {
    const info = grabInfo(r, id);
    const kvs = list => list.filter(([, v]) => !isEmpty(v)).map(([k, v]) => printKv(k, v));
    const parts = [printHead(grabLocation(r), 'Grabblatt'),
      el('div', { class: 'p-fields' }, kvs(info.lage), printKv('Status', info.statusText), kvs(info.fristen),
        info.holders.length > 0 && printKv('Nutzungsberechtigte', info.holders.map(p => personName(p.t, p.r)).join('; ')))];
    const section = (head, content) => parts.push(el('div', { class: 'p-sec' }, el('h3', null, head), content));
    for (const [k, v] of info.notes) section(k === 'Notiz' ? 'Notiz' : 'Notiz – ' + k, el('div', { class: 'p-v' }, v));
    if (info.occupancy) section('Belegung (Stand ' + fmtDate(TODAY) + ')', el('table', { class: 'p-table', style: 'width:auto' },
      el('thead', null, el('tr', null, OCC_HEADS.map(h => el('th', null, h)))),
      el('tbody', null, info.occupancy.map(o => el('tr', null, el('td', null, o.h), el('td', null, o.b), el('td', null, o.f), el('td', null, o.m))))));
    if (burialTable) section('Verstorbene im Grab (' + info.burials.length + ')', info.burials.length
      ? printTable(BURIAL_HEADS, info.burials.map(burialCells)) : el('p', null, 'Keine Bestatteten erfasst.'));
    printOpen(prints, section);
    parts.push(el('div', { class: 'p-note' }, 'Auszug aus dem FriedaWeb-Archiv. Enthält personenbezogene Daten – nur für berechtigte Personen. Weitere Angaben zum Grab in der Archivansicht bzw. im Excel.'));
    return parts;
  }
  function printList(head, columns, items, filterText) {
    return [printHead(head, items.length.toLocaleString('de-AT') + ' Treffer' + (filterText ? ' · ' + filterText : '')),
      printTable(columns.map(c => c.h), items.map(it => columns.map(c => fmtCell(c.get(it)))))];
  }
  // Schnittstelle für die Grabblatt-PDFs (Export-FriedaWebGrabblaetter.ps1): dieselbe Druckvorlage wie
  // „Grabblatt drucken“, ohne aufgeklappte Bereiche. Der Titel ist zugleich der Dateiname des PDFs.
  let pdfMode = false;
  window.FW_PDF = grabTable ? {
    list: () => sortedGraves().map(r => ({ id: String(r[grabTable.idIdx]), title: grabLocation(r), status: statusLabel(grabStatus(r)) })),
    render: id => {
      const r = grabTable.byId.get(String(id));
      if (!r) return false;
      pdfMode = true;
      fill(printBox, printGrab(r, String(id), []));
      document.body.classList.add('has-print');
      return true;
    }
  } : null;
  window.addEventListener('beforeprint', () => {
    if (pdfMode) return;
    const content = currentPrint ? currentPrint() : null;
    document.body.classList.toggle('has-print', !!content);
    fill(printBox, content);
  });
  window.addEventListener('afterprint', () => { if (pdfMode) return; document.body.classList.remove('has-print'); fill(printBox); });

  function route() {
    currentPrint = null;
    const parts = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent);
    if (parts[0] === 'd' && T[parts[1]]) detailView(parts[1], parts[2]);
    else if (parts[0] === 't' && T[parts[1]]) tableView(parts[1]);
    else if (parts[0] === 'info') infoView();
    else grabView();
    window.scrollTo(0, 0);
  }
  document.getElementById('subtitle').textContent = M.subtitle || '';
  document.title = M.title || document.title;
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
